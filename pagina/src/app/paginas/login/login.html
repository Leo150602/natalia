<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-badge"><img src="fondo_negro_odecor.jpeg.png" alt="Odecor Logo" class="login-logo-img" /></div>
      <h1 class="login-title">Odecor Posventa</h1>
      <p class="login-subtitle">Gestión de Obras y Control de Calidad</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="input-group-custom">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            required 
            placeholder="Ingrese su usuario"
            autocomplete="username"
            [disabled]="cargando"
          />
        </div>
      </div>

      <div class="input-group-custom">
        <label for="password">Contraseña</label>
        <div class="input-wrapper" style="position: relative;">
          <span class="input-icon">🔒</span>
          <input 
            [type]="verPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required 
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            [disabled]="cargando"
            style="padding-right: 45px;"
          />
          <button 
            type="button" 
            (click)="verPassword = !verPassword"
            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #a0aec0; z-index: 10; padding: 0;"
            [title]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ verPassword ? '👁️' : '🙈' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="cargando">
        <span *ngIf="!cargando" class="btn-text">Iniciar Sesión</span>
        <div *ngIf="cargando" class="spinner"></div>
      </button>
    </form>

    <div class="login-footer">
      <p>&copy; 2026 Odecor Posventa. Todos los derechos reservados.</p>
    </div>
  </div>
</div>
