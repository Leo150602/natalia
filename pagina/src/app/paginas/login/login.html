<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-badge">🏢</div>
      <h1 class="login-title">Odecor Posventa</h1>
      <p class="login-subtitle">Gestión de Obras y Control de Calidad</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <!-- Username Field -->
      <div class="input-group-custom">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="username" 
            required 
            placeholder="Ingrese su usuario"
            autocomplete="username"
            [disabled]="cargando"
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="input-group-custom">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required 
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            [disabled]="cargando"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" [disabled]="cargando">
        <span *ngIf="!cargando" class="btn-text">Iniciar Sesión</span>
        <div *ngIf="cargando" class="spinner"></div>
      </button>
    </form>

    <div class="login-footer">
      <p>&copy; 2026 Odecor Posventa. Todos los derechos reservados.</p>
    </div>
  </div>
</div>
