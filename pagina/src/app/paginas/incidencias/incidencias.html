<div class="container-fluid p-4">
  <!-- Cabecera Nueva -->
  <div class="table-page-header mb-4">
    <!-- Top: Título y Subtítulo -->
    <div class="header-title-box">
      <h1 class="page-title">Gestión de Incidencias</h1>
      <p class="page-subtitle">Listado completo de incidencias técnicas registradas en la promoción activa</p>
    </div>
    
    <!-- Separador -->
    <div class="header-separator"></div>
    
    <!-- Bottom: Barra de menú de acciones integrada -->
    <div class="header-menu-bar d-flex justify-content-between align-items-center">
      <!-- Izquierda: Opciones de creación -->
      <div class="menu-left-group d-flex align-items-center">
        <a class="menu-action-item" routerLink="/incidencias/detalle/nuevo" *ngIf="permisosService.puedeInsertarEditarIncidencias() && !permisosService.esCliente() && !permisosService.esTecnico()">
          <span>➕</span> Crear Incidencia
        </a>
        <a class="menu-action-item" routerLink="/incidencias/detalle/nuevo" *ngIf="!permisosService.puedeInsertarEditarIncidencias() || permisosService.esCliente() || permisosService.esTecnico()">
          <span>➕</span> Solicitar Incidencia
        </a>
      </div>
      
      <!-- Derecha: Filtrado, Importar, Exportar -->
      <div class="menu-right-group d-flex align-items-center">
        <input 
          type="file" 
          #fileInput 
          (change)="importarExcel($event)" 
          accept=".xlsx, .xls" 
          class="d-none" />

        <!-- Filtrado -->
        <div class="position-relative menu-action-dropdown">
          <button class="menu-action-item" (click)="toggleMenuFiltros()">
            <span>🔍</span> Filtrado
          </button>
  
          <!-- Tarjeta de Filtros Flotante -->
          <div *ngIf="mostrarMenuFiltros" class="card shadow-lg border border-light position-absolute end-0 mt-2 p-3 panel-filtros-flotante" style="width: 380px; z-index: 1080;">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0 font-weight-bold text-dark">🔍 Búsqueda Avanzada</h6>
              <button type="button" class="btn-close" style="font-size: 12px;" (click)="toggleMenuFiltros()"></button>
            </div>
  
            <form (ngSubmit)="aplicarFiltros()" #filtrosForm="ngForm">
              <!-- Nº Incidencia -->
              <div class="mb-2">
                <label for="numeroIncidencia" class="form-label small font-weight-bold mb-1">Número de Incidencia</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm" 
                  id="numeroIncidencia" 
                  name="numeroIncidencia" 
                  [(ngModel)]="filtros.numeroIncidencia" 
                  placeholder="Ej. INC-001" />
              </div>
  
              <!-- Piso -->
              <div class="mb-2">
                <label for="piso" class="form-label small font-weight-bold mb-1">Piso</label>
                <input 
                  type="text" 
                  class="form-control form-control-sm" 
                  id="piso" 
                  name="piso" 
                  [(ngModel)]="filtros.piso" 
                  placeholder="Ej. 1º A" />
              </div>
  
              <!-- Categoría -->
              <div class="mb-2">
                <label for="categoria" class="form-label small font-weight-bold mb-1">Categoría</label>
                <select 
                  class="form-select form-select-sm" 
                  id="categoria" 
                  name="categoria" 
                  [(ngModel)]="filtros.categoriaIncidencia">
                  <option value="">Todas...</option>
                  <option *ngFor="let cat of categorias" [value]="cat.value">
                    {{ cat.descripcion }}
                  </option>
                </select>
              </div>
  
              <!-- Estado -->
              <div class="mb-2">
                <label for="estado" class="form-label small font-weight-bold mb-1">Estado</label>
                <select 
                  class="form-select form-select-sm" 
                  id="estado" 
                  name="estado" 
                  [(ngModel)]="filtros.estadoIncidencia">
                  <option value="">Todos...</option>
                  <option *ngFor="let est of estados" [value]="est.value">
                    {{ est.descripcion }}
                  </option>
                </select>
              </div>
  
              <!-- Rango Fecha Desde -->
              <div class="mb-2">
                <label for="fechaInicial" class="form-label small font-weight-bold mb-1">Fecha Desde</label>
                <input 
                  type="datetime-local" 
                  class="form-control form-control-sm" 
                  id="fechaInicial" 
                  name="fechaInicial" 
                  [(ngModel)]="filtros.fechaInicial" />
              </div>
  
              <!-- Rango Fecha Hasta -->
              <div class="mb-3">
                <label for="fechaFinal" class="form-label small font-weight-bold mb-1">Fecha Hasta</label>
                <input 
                  type="datetime-local" 
                  class="form-control form-control-sm" 
                  id="fechaFinal" 
                  name="fechaFinal" 
                  [(ngModel)]="filtros.fechaFinal" />
              </div>
  
              <!-- Botones de Acción -->
              <div class="d-flex justify-content-end gap-2 border-top pt-2">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3" (click)="limpiarFiltros()">
                  Limpiar
                </button>
                <button type="submit" class="btn btn-primary btn-sm px-4">
                  Buscar
                </button>
              </div>
            </form>
          </div>
  
          <!-- Backdrop invisible -->
          <div *ngIf="mostrarMenuFiltros" class="backdrop-filtros" (click)="toggleMenuFiltros()"></div>
        </div>

        <!-- Importar Excel -->
        <button *ngIf="permisosService.puedeInsertarEditarIncidencias() && !permisosService.esCliente() && !permisosService.esTecnico()" class="menu-action-item" (click)="fileInput.click()">
          <span>📥</span> Importar Excel
        </button>

        <!-- Exportar Excel -->
        <button class="menu-action-item" (click)="exportarExcel()">
          <span>📤</span> Exportar Excel
        </button>
      </div>
    </div>
  </div>

  <!-- Tabla de Resultados -->
  <div class="row">
    <div class="col-12">
      <app-tabla-datos
        [datos]="datos"
        [columnas]="config.columnas"
        [mostrarId]="config.mostrarId"
        [idCampo]="config.idCampo"
        [idNombre]="config.idNombre"
        [permitirAcciones]="true"
        [mostrarAccionesEdicion]="permisosService.puedeInsertarEditarIncidencias()"
        [cargando]="cargando"
        (editar)="editarIncidencia($event)"
        (eliminar)="eliminarIncidencia($event)"
        (verDetalle)="irAlDetalle($event)">
      </app-tabla-datos>
    </div>
  </div>

  <!-- Modal de Exportación con Filtros y Switches -->
  <div *ngIf="mostrarModalExportar" class="custom-modal-overlay animate__animated animate__fadeIn" (click)="cerrarModalExportar()">
    <div class="custom-modal-container" (click)="$event.stopPropagation()" style="width: 480px; max-width: 95%;">
      <div class="custom-modal-header d-flex justify-content-between align-items-center mb-3">
        <h5 class="m-0 font-weight-bold text-dark">📤 Exportar Incidencias a Excel</h5>
        <button class="btn-close-modal" (click)="cerrarModalExportar()">&times;</button>
      </div>
      
      <div class="custom-modal-body" style="max-height: 70vh; overflow-y: auto; padding-right: 5px;">
        <p class="text-muted mb-4" style="font-size: 0.8rem;">
          Active los campos que desea usar como criterio de filtro para el reporte de Excel:
        </p>



        <!-- Filtro 2: Piso -->
        <div class="mb-3 p-2 border rounded bg-light">
          <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
            <label class="form-check-label font-weight-bold text-dark ms-0" for="switchPiso" style="font-size: 0.85rem; cursor: pointer;">
              Filtrar por Piso
            </label>
            <input class="form-check-input ms-0 cursor-pointer" type="checkbox" role="switch" id="switchPiso" [(ngModel)]="habilitarFiltroPiso" />
          </div>
          <div *ngIf="habilitarFiltroPiso" class="mt-2 animate__animated animate__fadeIn">
            <input type="text" class="form-control text-dark" [(ngModel)]="filtrosExportar.piso" placeholder="Ej. 1º A" />
          </div>
        </div>

        <!-- Filtro 3: Categoría -->
        <div class="mb-3 p-2 border rounded bg-light">
          <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
            <label class="form-check-label font-weight-bold text-dark ms-0" for="switchCategoria" style="font-size: 0.85rem; cursor: pointer;">
              Filtrar por Categoría
            </label>
            <input class="form-check-input ms-0 cursor-pointer" type="checkbox" role="switch" id="switchCategoria" [(ngModel)]="habilitarFiltroCategoria" />
          </div>
          <div *ngIf="habilitarFiltroCategoria" class="mt-2 animate__animated animate__fadeIn">
            <select class="form-select text-dark" [(ngModel)]="filtrosExportar.categoriaIncidencia">
              <option value="" disabled>Seleccione categoría...</option>
              <option *ngFor="let cat of categorias" [value]="cat.value">{{ cat.descripcion }}</option>
            </select>
          </div>
        </div>

        <!-- Filtro 4: Estado -->
        <div class="mb-3 p-2 border rounded bg-light">
          <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
            <label class="form-check-label font-weight-bold text-dark ms-0" for="switchEstado" style="font-size: 0.85rem; cursor: pointer;">
              Filtrar por Estado de Incidencia
            </label>
            <input class="form-check-input ms-0 cursor-pointer" type="checkbox" role="switch" id="switchEstado" [(ngModel)]="habilitarFiltroEstado" />
          </div>
          <div *ngIf="habilitarFiltroEstado" class="mt-2 animate__animated animate__fadeIn">
            <select class="form-select text-dark" [(ngModel)]="filtrosExportar.estadoIncidencia">
              <option value="" disabled>Seleccione estado...</option>
              <option *ngFor="let est of estados" [value]="est.value">{{ est.descripcion }}</option>
            </select>
          </div>
        </div>

        <!-- Filtro 5: Rango de Fechas -->
        <div class="mb-3 p-2 border rounded bg-light">
          <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
            <label class="form-check-label font-weight-bold text-dark ms-0" for="switchFechas" style="font-size: 0.85rem; cursor: pointer;">
              Filtrar por Rango de Fechas
            </label>
            <input class="form-check-input ms-0 cursor-pointer" type="checkbox" role="switch" id="switchFechas" [(ngModel)]="habilitarFiltroFechas" />
          </div>
          <div *ngIf="habilitarFiltroFechas" class="mt-2 row g-2 animate__animated animate__fadeIn">
            <div class="col-6">
              <label class="small text-muted mb-1 d-block">Fecha Desde</label>
              <input type="datetime-local" class="form-control form-control-sm text-dark bg-white" [(ngModel)]="filtrosExportar.fechaInicial" />
            </div>
            <div class="col-6">
              <label class="small text-muted mb-1 d-block">Fecha Hasta</label>
              <input type="datetime-local" class="form-control form-control-sm text-dark bg-white" [(ngModel)]="filtrosExportar.fechaFinal" />
            </div>
          </div>
        </div>
      </div>

      <div class="custom-modal-footer d-flex gap-2 justify-content-end mt-4">
        <button class="btn btn-outline-secondary btn-sm px-3" (click)="cerrarModalExportar()">Cancelar</button>
        <button class="btn btn-success btn-sm px-4 font-weight-bold" (click)="ejecutarExportacionConFiltros()">
          📥 Generar Excel
        </button>
      </div>
    </div>
  </div>

</div>
