<div class="container p-4" style="max-width: 600px;">
  <div class="card shadow">
    <div class="card-header bg-primary text-white p-3">
      <h2 class="mb-0">{{ modoEdicion ? 'Actualizar Piso' : 'Registrar Nuevo Piso' }}</h2>
      <small>{{ modoEdicion ? 'Modifique los campos necesarios' : 'Complete la ficha del piso para darlo de alta en la promoción seleccionada' }}</small>
    </div>

    <div class="card-body p-4">
      <form (ngSubmit)="guardar()" #pisoForm="ngForm">
        
        <!-- Identificación del Piso -->
        <div class="mb-3">
          <label for="piso" class="form-label font-weight-bold">Identificación del Piso *</label>
          <input 
            type="text" 
            class="form-control" 
            id="piso" 
            name="piso" 
            [(ngModel)]="nuevoPiso.piso" 
            required 
            [placeholder]="placeholderPiso" />
        </div>

        <!-- Propietario -->
        <div class="mb-4 position-relative">
          <label for="buscarPropietario" class="form-label font-weight-bold">Propietario Asignado</label>
          <div class="input-group">
            <input 
              type="text" 
              class="form-control" 
              id="buscarPropietario"
              name="buscarPropietario"
              [(ngModel)]="terminoBusqueda" 
              (input)="filtrarPropietarios()"
              (focus)="mostrarOpciones = true"
              (blur)="onBlur()"
              [disabled]="cargando"
              placeholder="Escriba nombre o teléfono (mín. 2 caracteres)..." 
              autocomplete="off" />
            <button *ngIf="nuevoPiso.idPropietario" type="button" class="btn btn-outline-secondary" (click)="limpiarPropietarioSeleccionado()">
              ✕
            </button>
          </div>
          
          <!-- Lista de sugerencias descolgable -->
          <ul class="dropdown-menu show w-100 search-results-dropdown" 
              *ngIf="mostrarOpciones && terminoBusqueda.length >= 2 && propietariosFiltrados.length > 0"
              style="max-height: 200px; overflow-y: auto; z-index: 1000; position: absolute; left: 0; right: 0;">
            <li *ngFor="let p of propietariosFiltrados">
              <button type="button" class="dropdown-item" (mousedown)="seleccionarPropietario(p)">
                {{ p.nombre }} (Tel: {{ p.telefono }})
              </button>
            </li>
          </ul>
          
          <div class="form-text text-success mt-2" *ngIf="propietarioSeleccionadoLabel">
            Seleccionado: <strong>{{ propietarioSeleccionadoLabel }}</strong>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" (click)="cancelar()" [disabled]="cargando">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="!pisoForm.form.valid || cargando">
            <span *ngIf="!cargando">Guardar Registro</span>
            <span *ngIf="cargando">Registrando...</span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
