<div class="container-fluid p-4">
  
  <!-- Cabecera de Pisos -->
  <div class="table-page-header mb-4">
    <!-- Top: Título y Subtítulo -->
    <div class="header-title-box">
      <h1 class="page-title">Gestión de Pisos / Viviendas</h1>
      <p class="page-subtitle">Listado de pisos registrados y herramientas de carga/descarga Excel para la promoción seleccionada</p>
    </div>
    
    <!-- Separador -->
    <div class="header-separator"></div>
    
    <!-- Bottom: Barra de menú de acciones integrada -->
    <div class="header-menu-bar d-flex justify-content-between align-items-center">
      <!-- Izquierda: Opciones de creación -->
      <div class="menu-left-group d-flex align-items-center">
        <a class="menu-action-item" routerLink="/pisos/detalle/nuevo" *ngIf="permisosService.puedeInsertarEditarPisosYPropietarios()">
          <span>➕</span> Crear Piso
        </a>
      </div>
      
      <!-- Derecha: Filtrado e Importar/Exportar -->
      <div class="menu-right-group d-flex align-items-center gap-2">
        <!-- Filtrado -->
        <div class="position-relative menu-action-dropdown">
          <button class="menu-action-item" (click)="toggleMenuFiltros()">
            <span>🔍</span> Filtrado
          </button>

          <!-- Tarjeta de Filtros Flotante -->
          <div *ngIf="mostrarMenuFiltros" class="card shadow-lg border border-light position-absolute end-0 mt-2 p-3 panel-filtros-flotante" style="width: 320px; z-index: 1080;">
            <h6 class="mb-3 text-dark font-weight-bold">Filtros de Búsqueda</h6>
            
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label field-label">Piso</label>
                <input type="text" class="form-control" [(ngModel)]="filtros.piso" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por piso...">
              </div>
              <div class="col-12">
                <label class="form-label field-label">Propietario</label>
                <input type="text" class="form-control" [(ngModel)]="filtros.propietario" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por propietario...">
              </div>
              <div class="col-12">
                <label class="form-label field-label">Teléfono</label>
                <input type="text" class="form-control" [(ngModel)]="filtros.telefono" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por teléfono...">
              </div>
              
              <div class="col-12 mt-3 d-flex gap-2">
                <button class="btn btn-sm btn-primary flex-grow-1" (click)="toggleMenuFiltros()">Aceptar</button>
                <button class="btn btn-sm btn-outline-secondary flex-grow-1" (click)="limpiarFiltros()">Limpiar</button>
              </div>
            </div>
          </div>

          <!-- Backdrop invisible para cerrar el menú al hacer clic fuera -->
          <div *ngIf="mostrarMenuFiltros" class="backdrop-filtros" (click)="toggleMenuFiltros()"></div>
        </div>

        <!-- Carga de Archivo Oculta -->
        <input 
          type="file" 
          #fileInput 
          (change)="importarExcel($event)" 
          accept=".xlsx, .xls" 
          class="d-none" />

        <button class="menu-action-item" (click)="fileInput.click()" *ngIf="permisosService.puedeInsertarEditarPisosYPropietarios()">
          <span>📥</span> Importar Excel
        </button>

        <button class="menu-action-item" (click)="exportarExcel()">
          <span>📤</span> Exportar Excel
        </button>
      </div>
    </div>
  </div>

  <!-- Tabla de Resultados -->
  <div class="row">
    <div class="col-12">
      <app-tabla-datos
        [datos]="datosFiltrados"
        [columnas]="config.columnas"
        [mostrarId]="config.mostrarId"
        [idCampo]="config.idCampo"
        [idNombre]="config.idNombre"
        [permitirAcciones]="true"
        [mostrarAccionesEdicion]="permisosService.puedeInsertarEditarPisosYPropietarios()"
        [cargando]="cargando"
        (editar)="editarPiso($event)"
        (eliminar)="eliminarPiso($event)"
        (verDetalle)="irAlDetalle($event)">
      </app-tabla-datos>
    </div>
  </div>
</div>
