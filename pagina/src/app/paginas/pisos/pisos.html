<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="mb-0">Importación y Gestión de Pisos</h1>
      <p class="text-muted mb-0">Listado de pisos registrados y herramientas de carga/descarga Excel para la promoción seleccionada</p>
    </div>
    
    <div class="d-flex gap-2">
      <!-- Input de archivo oculto -->
      <input 
        type="file" 
        #fileInput 
        (change)="importarExcel($event)" 
        accept=".xlsx, .xls" 
        class="d-none" />

      <!-- Botón Importar -->
      <button class="btn btn-outline-primary d-flex align-items-center gap-2" (click)="fileInput.click()">
        <span>Importar Excel</span>
      </button>

      <!-- Botón Exportar -->
      <button class="btn btn-primary d-flex align-items-center gap-2" (click)="exportarExcel()">
        <span>Exportar Excel</span>
      </button>
    </div>
  </div>

  <!-- Barra de Filtros Reactivos -->
  <div class="card bg-dark border-secondary mb-4">
    <div class="card-body p-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-3">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-secondary text-white border-secondary">Piso</span>
            <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="filtros.piso" (ngModelChange)="aplicarFiltros()" placeholder="Buscar piso...">
          </div>
        </div>
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-secondary text-white border-secondary">Propietario</span>
            <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="filtros.propietario" (ngModelChange)="aplicarFiltros()" placeholder="Buscar propietario...">
          </div>
        </div>
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-secondary text-white border-secondary">Teléfono</span>
            <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="filtros.telefono" (ngModelChange)="aplicarFiltros()" placeholder="Buscar teléfono...">
          </div>
        </div>
        <div class="col-md-1 text-end">
          <button class="btn btn-sm btn-outline-secondary w-100" (click)="limpiarFiltros()">Limpiar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tabla-datos
        [datos]="datosFiltrados"
        [columnas]="config.columnas"
        [mostrarId]="config.mostrarId"
        [idCampo]="config.idCampo"
        [idNombre]="config.idNombre"
        [permitirAcciones]="permisosService.puedeInsertarEditarPisosYPropietarios()"
        [cargando]="cargando"
        (editar)="editarPiso($event)"
        (eliminar)="eliminarPiso($event)">
      </app-tabla-datos>
    </div>
  </div>
</div>
