<div class="container-fluid p-4">
  <div class="mb-4 d-flex justify-content-between align-items-center">
    <div>
      <h1 class="mb-0 text-dark">Solicitudes de Incidencias</h1>
      <p class="text-muted mb-0">Listado de incidencias solicitadas por técnicos o clientes pendientes de aprobación</p>
    </div>
    <div *ngIf="seleccionados.length > 0" class="d-flex gap-2 animate__animated animate__fadeIn">
      <button class="btn btn-success d-flex align-items-center gap-1" (click)="aceptarMarcadas()">
        ✔️ Aceptar marcadas ({{ seleccionados.length }})
      </button>
      <button class="btn btn-danger d-flex align-items-center gap-1" (click)="rechazarMarcadas()">
        ❌ Rechazar marcadas ({{ seleccionados.length }})
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tabla-datos
        [datos]="datos"
        [columnas]="config.columnas"
        [mostrarId]="config.mostrarId"
        [idCampo]="config.idCampo"
        [idNombre]="config.idNombre"
        [cargando]="cargando"
        [seleccionable]="permisosService.puedeInsertarEditar()"
        (seleccionCambiada)="onSeleccionCambiada($event)"
        [permitirAcciones]="permisosService.puedeInsertarEditar()"
        etiquetaEditar="Aceptar"
        iconoEditar="✔️"
        etiquetaEliminar="Rechazar"
        iconoEliminar="❌"
        (editar)="aceptarSolicitud($event)"
        (eliminar)="rechazarSolicitud($event)">
      </app-tabla-datos>
    </div>
  </div>
</div>
