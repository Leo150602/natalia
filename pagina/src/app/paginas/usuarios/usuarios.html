<div class="container-fluid p-4">
  <div class="mb-4">
    <h1 class="mb-0 text-dark">Administración de Usuarios</h1>
    <p class="text-muted mb-0">Gestión de usuarios registrados en el sistema. Haga clic derecho en un registro para ver opciones de edición y eliminación.</p>
  </div>

  <div class="card bg-white border-light-custom mb-4 shadow-sm">
    <div class="card-body p-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-3">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-light text-dark border-secondary-subtle">Usuario</span>
            <input type="text" class="form-control bg-white text-dark border-secondary-subtle" [(ngModel)]="filtroUsername" (ngModelChange)="aplicarFiltros()" placeholder="Buscar usuario...">
          </div>
        </div>
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-light text-dark border-secondary-subtle">Nombre</span>
            <input type="text" class="form-control bg-white text-dark border-secondary-subtle" [(ngModel)]="filtroNombre" (ngModelChange)="aplicarFiltros()" placeholder="Buscar nombre...">
          </div>
        </div>
        <div class="col-md-3">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-light text-dark border-secondary-subtle">Rol</span>
            <select class="form-select bg-white text-dark border-secondary-subtle" [(ngModel)]="filtroRol" (ngModelChange)="aplicarFiltros()">
              <option value="">Todos los roles</option>
              <option *ngFor="let rol of rolesDisponibles" [value]="rol.value">{{ rol.label }}</option>
            </select>
          </div>
        </div>
        <div class="col-md-2 text-end">
          <button class="btn btn-sm btn-outline-secondary w-100" (click)="limpiarFiltros()">Limpiar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tabla-datos
        [datos]="usuariosFiltrados"
        [columnas]="config.columnas"
        [mostrarId]="config.mostrarId"
        [idCampo]="config.idCampo"
        [idNombre]="config.idNombre"
        [permitirAcciones]="permisosService.puedeRegistrarUsuarios()"
        [cargando]="cargando"
        (editar)="editarUsuario($event)"
        (eliminar)="eliminarUsuario($event)">
      </app-tabla-datos>
    </div>
  </div>
</div>
