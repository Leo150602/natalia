<div class="container-fluid p-4">
  <div class="mb-4">
    <h1 class="mb-0">Visitas de Posventa</h1>
    <p class="text-muted mb-0">Listado de visitas técnicas y estados de reparación/revisión en pisos</p>
  </div>

  <!-- Barra de Filtros Reactivos -->
  <div class="card bg-dark border-secondary mb-4">
    <div class="card-body p-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-3">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-secondary text-white border-secondary">Nº Incidencia</span>
            <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="filtros.numeroIncidencia" (ngModelChange)="aplicarFiltros()" placeholder="Buscar incidencia...">
          </div>
        </div>
        <div class="col-md-3">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-secondary text-white border-secondary">Piso</span>
            <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="filtros.piso" (ngModelChange)="aplicarFiltros()" placeholder="Buscar piso...">
          </div>
        </div>
        <div class="col-md-3">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-secondary text-white border-secondary">Técnico</span>
            <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="filtros.tecnico" (ngModelChange)="aplicarFiltros()" placeholder="Buscar técnico...">
          </div>
        </div>
        <div class="col-md-2">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-secondary text-white border-secondary">Estado</span>
            <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="filtros.estado" (ngModelChange)="aplicarFiltros()" placeholder="Buscar estado...">
          </div>
        </div>
        <div class="col-md-1 text-end">
          <button class="btn btn-sm btn-outline-secondary w-100" (click)="limpiarFiltros()">Limpiar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <app-tabla-datos
        [datos]="datosFiltrados"
        [columnas]="config.columnas"
        [mostrarId]="config.mostrarId"
        [idCampo]="config.idCampo"
        [idNombre]="config.idNombre"
        (editar)="editarVisita($event)"
        (eliminar)="eliminarVisita($event)">
      </app-tabla-datos>
    </div>
  </div>
</div>
