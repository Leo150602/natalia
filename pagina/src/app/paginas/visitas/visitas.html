<div class="container-fluid p-4">
  
  <!-- Cabecera de Visitas -->
  <div class="table-page-header mb-4">
    <!-- Top: Título y Subtítulo -->
    <div class="header-title-box">
      <h1 class="page-title">Visitas de Posventa</h1>
      <p class="page-subtitle">Listado de visitas técnicas y estados de reparación/revisión en pisos</p>
    </div>
    
    <!-- Separador -->
    <div class="header-separator"></div>
    
    <!-- Bottom: Barra de menú de acciones integrada -->
    <div class="header-menu-bar d-flex justify-content-between align-items-center">
      <!-- Izquierda: Opciones de creación -->
      <div class="menu-left-group d-flex align-items-center">
        <a class="menu-action-item" routerLink="/visitas/detalle/nuevo" *ngIf="permisosService.puedeInsertarEditarIncidencias() && !permisosService.esCliente() && !permisosService.esTecnico()">
          <span>➕</span> Agendar Visita
        </a>
        <a class="menu-action-item" routerLink="/visitas/detalle/nuevo" *ngIf="!(permisosService.puedeInsertarEditarIncidencias() && !permisosService.esCliente() && !permisosService.esTecnico())">
          <span>➕</span> Solicitar Visita
        </a>
      </div>
      
      <!-- Derecha: Filtrado, Importar -->
      <div class="menu-right-group d-flex align-items-center">
        <!-- Filtrado -->
        <div class="position-relative menu-action-dropdown">
          <button class="menu-action-item" (click)="toggleMenuFiltros()">
            <span>🔍</span> Filtrado
          </button>

          <!-- Tarjeta de Filtros Flotante -->
          <div *ngIf="mostrarMenuFiltros" class="card shadow-lg border border-light position-absolute end-0 mt-2 p-3 panel-filtros-flotante" style="width: 350px; z-index: 1080;">
            <h6 class="mb-3 text-dark font-weight-bold">Filtros de Búsqueda</h6>
            
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label field-label">Nº Incidencia</label>
                <input type="text" class="form-control" [(ngModel)]="filtros.numeroIncidencia" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por nº incidencia...">
              </div>
              <div class="col-12">
                <label class="form-label field-label">Piso</label>
                <input type="text" class="form-control" [(ngModel)]="filtros.piso" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por piso...">
              </div>
              <div class="col-12">
                <label class="form-label field-label">Técnico</label>
                <input type="text" class="form-control" [(ngModel)]="filtros.tecnico" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por técnico...">
              </div>
              <div class="col-12">
                <label class="form-label field-label">Estado</label>
                <input type="text" class="form-control" [(ngModel)]="filtros.estado" (ngModelChange)="aplicarFiltros()" placeholder="Buscar por estado...">
              </div>
              
              <div class="col-12 mt-3 d-flex gap-2">
                <button class="btn btn-sm btn-primary flex-grow-1" (click)="toggleMenuFiltros()">Aceptar</button>
                <button class="btn btn-sm btn-outline-secondary flex-grow-1" (click)="limpiarFiltros()">Limpiar</button>
              </div>
            </div>
          </div>

          <!-- Backdrop invisible para cerrar el menú al hacer clic fuera -->
          <div *ngIf="mostrarMenuFiltros" class="backdrop-filtros" (click)="toggleMenuFiltros()"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Tabla de Resultados -->
  <div class="row">
    <div class="col-12">
      <app-tabla-datos
        [datos]="datosFiltrados"
        [columnas]="config.columnas"
        [mostrarId]="config.mostrarId"
        [idCampo]="config.idCampo"
        [idNombre]="config.idNombre"
        [permitirAcciones]="true"
        [mostrarAccionesEdicion]="permisosService.puedeInsertarEditarIncidencias()"
        [cargando]="cargando"
        (editar)="editarVisita($event)"
        (eliminar)="eliminarVisita($event)"
        (verDetalle)="irAlDetalle($event)">
      </app-tabla-datos>
    </div>
  </div>
</div>
