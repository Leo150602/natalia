<div class="mat-elevation-z4 tabla-wrapper">
  <div class="tabla-scrollable">
    <table mat-table [dataSource]="dataSource" matSort class="w-100 table-custom">

      <!-- Columnas Dinámicas -->
      <ng-container *ngFor="let col of columnasVisibles" [matColumnDef]="col">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="cabecera-celda">
          {{ obtenerNombreColumna(col) }}
        </th>
        <td mat-cell *matCellDef="let element" class="dato-celda">
          {{ obtenerValorCelda(element, col) }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasVisibles"></tr>
      
      <!-- Fila de Datos con Click Derecho -->
      <tr mat-row 
          *matRowDef="let row; columns: columnasVisibles;" 
          class="fila-dato"
          (contextmenu)="abrirMenuContextual($event, row)">
      </tr>
      
      <!-- Fila para cuando no hay datos -->
      <tr class="mat-row empty-row" *matNoDataRow>
        <td class="mat-cell text-center py-4 text-muted" [attr.colspan]="columnasVisibles.length">
          No se encontraron registros disponibles.
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator 
    [pageSizeOptions]="[5, 10, 20]" 
    showFirstLastButtons 
    aria-label="Seleccionar página" 
    class="paginador-custom">
  </mat-paginator>

  <!-- Menú Contextual Flotante -->
  <div *ngIf="menuContextualVisible"
       class="menu-contextual shadow-lg"
       [ngStyle]="{ 'top': menuContextualPosicion.y, 'left': menuContextualPosicion.x }">
    <button (click)="onEditar()" class="menu-item">
      <span class="icono">✏️</span> Actualizar
    </button>
    <button (click)="onEliminar()" class="menu-item eliminar">
      <span class="icono">🗑️</span> Eliminar
    </button>
  </div>

  <!-- Backdrop invisible para cerrar el menú al hacer clic fuera -->
  <div *ngIf="menuContextualVisible" 
       class="menu-contextual-backdrop" 
       (click)="cerrarMenuContextual()" 
       (contextmenu)="cerrarMenuContextual(); $event.preventDefault()">
  </div>
</div>
